syntax = "proto3";

import "google/protobuf/timestamp.proto";

option java_package = "io.github.janmalch.simplerssreader.settings";
option java_multiple_files = true;

message Settings {
  repeated FeedSource sources = 1;
}

message FeedSource {
  string id = 1;
  string url = 2;
  optional string title = 3;
  optional google.protobuf.Timestamp last_sync = 4;
}
